<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다이톱현탁액 | Co-Co 안전 복약 가이드</title>
<style>
:root{--paper:#FBFAF7;--ink:#1C2B33;--green:#1E7A5A;--green-soft:#E4F1EB;
      --amber:#B96A00;--amber-soft:#FBF0DF;--line:#E3E0D8;--muted:#6B7680;}
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:17px;}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Noto Sans SC','Noto Sans Thai',sans-serif;
     background:var(--paper);color:var(--ink);line-height:1.65;}
a{color:inherit;}
/* ── 사이트 상단 바: 로고 + 메뉴 ── */
.topbar{position:sticky;top:0;z-index:20;background:#fff;
     border-bottom:1px solid var(--line);}
.topbar-inner{max-width:720px;margin:0 auto;padding:14px 20px;
     display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.logo-mark{width:34px;height:34px;border-radius:9px;background:var(--green);
     color:#fff;font-weight:800;font-size:1rem;display:flex;
     align-items:center;justify-content:center;flex:0 0 auto;}
.logo-text{font-weight:800;font-size:1.15rem;color:var(--ink);}
.logo-sub{font-size:.68rem;color:var(--muted);display:block;margin-top:-2px;}
.topmenu{display:flex;gap:18px;font-size:.88rem;font-weight:600;color:var(--muted);}
.topmenu a:hover{color:var(--green);}
/* ── 공통 레이아웃 ── */
.wrap{max-width:720px;margin:0 auto;padding:20px 20px 80px;}
h1{font-size:1.6rem;line-height:1.3;font-weight:800;}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;
      padding:18px;margin-top:16px;}
/* ── 화면 전환 탭 (영상/글) ── */
.viewtab{display:flex;gap:8px;margin-top:20px;}
.viewtab button{flex:1;padding:14px 8px;border-radius:12px;font-size:1rem;
      font-weight:700;border:1.5px solid var(--line);background:#fff;
      color:var(--ink);cursor:pointer;}
.viewtab button.on{background:var(--green);border-color:var(--green);color:#fff;}
/* ── 언어 탭 (글 화면 안) ── */
.langtab{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;}
.langtab button{padding:8px 16px;border-radius:999px;font-size:.9rem;
      font-weight:600;border:1.5px solid var(--line);background:#fff;cursor:pointer;}
.langtab button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.label{font-size:.8rem;font-weight:800;letter-spacing:.06em;color:var(--green);}
.caution-card{background:var(--amber-soft);border-color:#EED9B8;}
.caution-card .label{color:var(--amber);}
.caution-card li{margin-bottom:10px;}
.caution-card li:last-child{margin-bottom:0;}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000;}
.hidden{display:none;}
/* ── 글 화면: 복용 금지 대상 (3칸) ── */
.sec-title{font-size:1.05rem;font-weight:800;margin-top:22px;}
.card ul{margin-top:8px;padding-left:20px;}
.card li{margin-bottom:8px;}
.card li:last-child{margin-bottom:0;}
.sub-block{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
.sub-block:first-of-type{margin-top:6px;padding-top:0;border-top:0;}
.sub-label{font-size:.92rem;font-weight:800;}
.ban-card{background:#FDECEC;border-color:#F1C9C9;}
.ban-card .sub-block{border-top-color:#F1C9C9;}
.ban-card .lv1{color:#B3261E;}
.ban-card .lv2{color:#9A5B00;}
.ban-card .lv3{color:#B3261E;}
.hero{background:var(--green-soft);border-radius:18px;padding:28px 22px;margin-top:4px;}
.hero .tag{display:inline-block;background:#fff;color:var(--green);font-weight:700;
     font-size:.78rem;border-radius:999px;padding:4px 12px;}
.hero h1{margin-top:12px;color:var(--green);}
.hero p{margin-top:8px;color:#2E4A3F;font-size:.92rem;max-width:46ch;}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px;}
.pillar{background:#fff;border:1px solid var(--line);border-radius:12px;
     padding:12px 10px;text-align:center;font-size:.78rem;font-weight:700;color:var(--muted);}
.pillar b{display:block;font-size:1.3rem;margin-bottom:4px;}
/* ── 약 목록 ── */
.section-title{font-size:1.05rem;font-weight:800;margin-top:34px;margin-bottom:4px;}
a.drug{display:block;background:#fff;border:1px solid var(--line);
      border-radius:14px;padding:18px;margin-top:12px;text-decoration:none;
      color:var(--ink);}
a.drug:hover{border-color:var(--green);}
a.drug b{font-size:1.1rem;}
a.drug span{display:block;color:var(--muted);font-size:.85rem;margin-top:2px;}
a.back{color:var(--green);font-weight:700;text-decoration:none;font-size:.9rem;}
/* ── 하단 푸터 ── */
footer.site{max-width:720px;margin:40px auto 0;padding:20px 20px 40px;
     color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <a class="logo" href="index.html">
    <span class="logo-mark">CC</span>
    <span><span class="logo-text">Co-Co</span>
    <span class="logo-sub">안전 복약 가이드</span></span>
  </a>
  <nav class="topmenu">
    <a href="index.html">홈</a>
    <a href="index.html#about">소개</a>
  </nav>
</div></div>
<div class="wrap">
<a class="back" href="index.html">&larr; 약 목록으로</a>
<h1 style="margin-top:12px" id="drug-name">다이톱현탁액</h1>
<p class="sub" id="drug-sub"></p>
<div class="viewtab">
  <button id="btn-video" onclick="setView('video')">수어·음성 영상</button>
  <button id="btn-text"  onclick="setView('text')">글로 보기</button>
</div>
<div id="view-video">
  <div class="card">
    <div class="label">수어 &amp; 음성 안내 영상</div>
    <iframe src="https://www.youtube.com/embed/VIDEO_ID_8" title="수어 안내 영상" allowfullscreen
            style="margin-top:10px"></iframe>
    <p class="sub" style="margin-top:10px">영상에는 수어 통역과 음성 설명이 함께 나옵니다.</p>
  </div>
</div>
<div id="view-text" class="hidden">
  <div class="langtab">
    <button id="lang-ko" class="on" onclick="setLang('ko')">한국어</button>
    <button id="lang-en" onclick="setLang('en')">English</button>
    <button id="lang-zh" onclick="setLang('zh')">中文</button>
    <button id="lang-vi" onclick="setLang('vi')">Tiếng Việt</button>
    <button id="lang-th" onclick="setLang('th')">ไทย</button>
  </div>

  <div id="blk-dose">
    <div class="sec-title" id="h-dose"></div>
    <div class="card"><ul id="l-dose"></ul></div>
  </div>

  <div id="blk-ban">
    <div class="sec-title" id="h-ban"></div>
    <div class="card ban-card">
      <div class="sub-block" id="blk-ban1"><div class="sub-label lv1" id="h-ban1"></div><ul id="l-ban"></ul></div>
      <div class="sub-block" id="blk-consult"><div class="sub-label lv2" id="h-consult"></div><ul id="l-consult"></ul></div>
      <div class="sub-block" id="blk-stop"><div class="sub-label lv3" id="h-stop"></div><ul id="l-stop"></ul></div>
    </div>
  </div>

  <div id="blk-caution">
    <div class="sec-title" id="h-caution"></div>
    <div class="card caution-card"><ul id="l-caution"></ul></div>
  </div>
</div>
</div>
<footer class="site">Co-Co 안전 복약 가이드 · 이 페이지는 의약품 이해를 돕기 위한
안내이며, 정확한 복용은 제품 첨부문서와 의사·약사의 지시를 따르세요.</footer>
<script>
const TEXT = {
  ko: {name:"다이톱현탁액", ing:"", dose:["성인: 1회 3g, 1일 3회. 급성 설사일 때 처음 3일은 1일 용량을 2배로 늘릴 수 있음.","식도염에는 식후에, 그 외에는 식사와 식사 사이에 복용."], ban:["소아","임신 중이거나 임신 가능성이 있는 여성, 수유 중"], consult:["다른 약을 복용 중인 경우 (약 흡수에 영향을 줄 수 있으므로 간격을 두고 복용)","심한 만성 변비","장폐색(창자막힘) 병력"], stop:["복부팽만감, 구토, 변비가 나타나는 경우","두드러기, 발진, 가려움, 혈관 부종 등 알레르기 증상","7일이 지나도 증상이 좋아지지 않는 경우"], caution:["정해진 용법·용량을 지키기","이 약은 수분을 보충해 주는 약이 아니므로, 탈수 증상이 나타나면 수액 등 수분 보충을 받기"]},
  en: {name:"Daitop Suspension", ing:"", dose:["Adults: 3 g at a time, 3 times a day. For acute diarrhea, the daily dose may be doubled for the first 3 days.","For esophagitis, take it after meals; otherwise take it between meals."], ban:["Children","Women who are pregnant or may be pregnant, or who are breastfeeding"], consult:["You are taking other medicines (this medicine can affect their absorption, so take them at different times)","Severe chronic constipation","A history of intestinal obstruction (blocked bowel)"], stop:["Bloating, vomiting or constipation occurs","Allergic symptoms such as hives, rash, itching or angioedema (swelling under the skin)","Your symptoms have not improved after 7 days"], caution:["Follow the stated dose","This medicine does not replace lost fluids. If you show signs of dehydration, get fluids such as an IV drip"]},
  zh: {name:"Daitop Suspension", ing:"", dose:["成人：每次3g，每日3次。急性腹泻时，前3天每日剂量可加倍。","食管炎饭后服用，其他情况在两餐之间服用。"], ban:["儿童","怀孕或可能怀孕的女性，哺乳期"], consult:["正在服用其他药物(可能影响药物吸收，请间隔一段时间服用)","严重慢性便秘","有肠梗阻(肠道堵塞)病史"], stop:["出现腹胀、呕吐、便秘","荨麻疹、皮疹、瘙痒、血管性水肿等过敏症状","服药7天后症状仍未改善"], caution:["请遵守规定的用法用量","本药不能补充水分，出现脱水症状时，应接受输液等补液治疗"]},
  vi: {name:"Daitop Suspension", ing:"", dose:["Người lớn: mỗi lần 3 g, 3 lần mỗi ngày. Khi tiêu chảy cấp, có thể tăng gấp đôi liều hằng ngày trong 3 ngày đầu.","Với viêm thực quản, uống sau bữa ăn; các trường hợp khác uống giữa các bữa ăn."], ban:["Trẻ em","Phụ nữ đang mang thai hoặc có thể mang thai, hoặc đang cho con bú"], consult:["Đang dùng thuốc khác (thuốc này có thể ảnh hưởng đến sự hấp thu, nên hãy uống cách nhau)","Táo bón mạn tính nặng","Từng bị tắc ruột"], stop:["Xuất hiện đầy hơi, nôn hoặc táo bón","Triệu chứng dị ứng như mày đay, phát ban, ngứa hoặc phù mạch (sưng dưới da)","Triệu chứng không cải thiện sau 7 ngày"], caution:["Dùng đúng liều quy định","Thuốc này không bù nước đã mất. Nếu có dấu hiệu mất nước, hãy được bù dịch như truyền dịch"]},
  th: {name:"Daitop Suspension", ing:"", dose:["ผู้ใหญ่: ครั้งละ 3 กรัม วันละ 3 ครั้ง กรณีท้องเสียเฉียบพลัน อาจเพิ่มขนาดยาต่อวันเป็น 2 เท่าใน 3 วันแรก","กรณีหลอดอาหารอักเสบให้กินหลังอาหาร กรณีอื่นให้กินระหว่างมื้ออาหาร"], ban:["เด็ก","สตรีที่ตั้งครรภ์หรืออาจตั้งครรภ์ หรือให้นมบุตร"], consult:["กำลังใช้ยาอื่น (ยานี้อาจมีผลต่อการดูดซึมยา จึงควรกินห่างกัน)","ท้องผูกเรื้อรังรุนแรง","เคยมีลำไส้อุดตัน"], stop:["มีอาการท้องอืด อาเจียน หรือท้องผูก","อาการแพ้ เช่น ลมพิษ ผื่น คัน หรือหลอดเลือดบวม (บวมใต้ผิวหนัง)","อาการไม่ดีขึ้นหลังใช้ยา 7 วัน"], caution:["ใช้ตามขนาดที่กำหนด","ยานี้ไม่ได้ทดแทนน้ำที่สูญเสียไป หากมีอาการขาดน้ำ ควรได้รับการให้สารน้ำ เช่น น้ำเกลือ"]}
};
const LABEL = {
  ko: {dose:'1. 복용법 (용법·용량)', ban:'2. 복용 금지 대상',
       ban1:'(1) 다음과 같은 사람은 이 약을 복용하지 말 것',
       consult:'(2) 복용 전 의사·약사와 상의해야 하는 대상',
       stop:'(3) 즉각 복용 중지하고 의사, 약사와 상의해야 하는 대상',
       caution:'3. 주의 사항'},
  en: {dose:'1. How to take (dose)', ban:'2. Who should not take this medicine',
       ban1:'(1) Do NOT take this medicine if you are in any of these groups',
       consult:'(2) Talk to a doctor or pharmacist BEFORE taking if',
       stop:'(3) STOP taking it right away and talk to a doctor or pharmacist if',
       caution:'3. Precautions'},
  zh: {dose:'1. 用法用量', ban:'2. 禁止服用的人群',
       ban1:'(1) 属于以下情况的人，请勿服用本药',
       consult:'(2) 服药前需先咨询医生或药师的人群',
       stop:'(3) 出现以下情况，请立即停药并咨询医生或药师',
       caution:'3. 注意事项'},
  vi: {dose:'1. Cách dùng (liều lượng)', ban:'2. Đối tượng không được dùng',
       ban1:'(1) KHÔNG dùng thuốc này nếu bạn thuộc các trường hợp sau',
       consult:'(2) Hỏi bác sĩ hoặc dược sĩ TRƯỚC khi dùng nếu',
       stop:'(3) NGỪNG dùng thuốc ngay và hỏi bác sĩ hoặc dược sĩ nếu',
       caution:'3. Lưu ý'},
  th: {dose:'1. วิธีใช้ (ขนาดยา)', ban:'2. ผู้ที่ไม่ควรใช้ยา',
       ban1:'(1) ห้ามใช้ยานี้หากอยู่ในกลุ่มต่อไปนี้',
       consult:'(2) ปรึกษาแพทย์หรือเภสัชกรก่อนใช้ยา หาก',
       stop:'(3) หยุดใช้ยาทันทีและปรึกษาแพทย์หรือเภสัชกร หาก',
       caution:'3. ข้อควรระวัง'}
};
function fill(id, items){
  const ul = document.getElementById('l-' + id);
  ul.innerHTML = '';
  items.forEach(t => { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
}
function show(blockId, on){ document.getElementById(blockId).classList.toggle('hidden', !on); }
function setView(v){
  document.getElementById('view-video').classList.toggle('hidden', v!=='video');
  document.getElementById('view-text').classList.toggle('hidden', v!=='text');
  document.getElementById('btn-video').classList.toggle('on', v==='video');
  document.getElementById('btn-text').classList.toggle('on', v==='text');
}
function setLang(l){
  const t = TEXT[l], lab = LABEL[l];
  document.documentElement.lang = l;
  document.getElementById('drug-name').textContent = t.name;
  document.getElementById('drug-sub').textContent = t.ing;
  ['dose','ban','caution'].forEach(k => document.getElementById('h-' + k).textContent = lab[k]);
  ['ban1','consult','stop'].forEach(k => document.getElementById('h-' + k).textContent = lab[k]);
  fill('dose', t.dose); fill('ban', t.ban); fill('consult', t.consult);
  fill('stop', t.stop); fill('caution', t.caution);
  show('blk-dose', t.dose.length > 0);
  show('blk-ban1', t.ban.length > 0);
  show('blk-consult', t.consult.length > 0);
  show('blk-stop', t.stop.length > 0);
  show('blk-ban', t.ban.length + t.consult.length + t.stop.length > 0);
  show('blk-caution', t.caution.length > 0);
  ['ko','en','zh','vi','th'].forEach(x => document.getElementById('lang-' + x).classList.toggle('on', x===l));
}
const first = new URLSearchParams(location.search).get('view') || 'video';
setView(first === 'text' ? 'text' : 'video');
setLang('ko');
</script>
</body>
</html>
